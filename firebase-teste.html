<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teste Firebase MTS</title><style>body{font-family:Arial;background:#0d0d0d;color:#fff;padding:32px;max-width:760px;margin:auto}.box{padding:20px;border:1px solid #333;border-radius:12px;margin:12px 0}.ok{color:#65d88b}.err{color:#ff7777}code{word-break:break-all}</style></head><body><h1>Diagnóstico Firebase MTS</h1><div id="status" class="box">Conectando...</div><div id="detail" class="box"></div><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><script src="js/firebase-config.js"></script><script src="js/firebase-sync.js"></script><script>async function test(){const s=document.getElementById('status'),d=document.getElementById('detail');try{if(!window.MTSCloud)throw new Error('MTSCloud não carregou');const p=await MTSCloud.getProducts();s.className='box ok';s.textContent='OK — Firestore conectado ao servidor';d.innerHTML='<b>Projeto:</b> '+MTS_FIREBASE_CONFIG.projectId+'<br><b>Produtos no catálogo:</b> '+(Array.isArray(p)?p.length:'catálogo ainda não criado')+'<br><b>Origem:</b> store/catalog';}catch(e){s.className='box err';s.textContent='ERRO — '+e.message;d.textContent='Abra o console do navegador para mais detalhes.';console.error(e)}}test();</script></body></html>
